<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>mouseum control</title>
  <style>
    :root { --bg:#1d1f23; --fg:#eee; --accent:#4caf50; --muted:#888; --btn:#2a2d33; }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         background:var(--bg);color:var(--fg);padding:1em;max-width:480px;margin:0 auto}
    h1{margin:.2em 0;font-size:1.3em}
    .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em;margin:.8em 0}
    button{font-size:1em;padding:.7em .4em;border:0;border-radius:.5em;
           background:var(--btn);color:var(--fg);cursor:pointer}
    button:active{background:var(--accent)}
    .row{display:flex;gap:.4em;flex-wrap:wrap;margin:.4em 0}
    .row > *{flex:1}
    label{display:block;margin:.3em 0 .1em;color:var(--muted);font-size:.85em}
    input[type=number]{width:100%;padding:.5em;background:#111;color:var(--fg);
                       border:1px solid #333;border-radius:.4em;font-size:1em}
    pre#log{background:#111;padding:.5em;border-radius:.4em;font-size:.8em;
            max-height:8em;overflow:auto;color:var(--muted)}
    .toggle.on{background:var(--accent)}
    small{color:var(--muted)}
  </style>
</head>
<body>
  <h1>mouseum <small id="state"></small></h1>

  <div class="row">
    <label style="flex:1">target dx
      <input id="dx" type="number" value="200">
    </label>
    <label style="flex:1">target dy
      <input id="dy" type="number" value="100">
    </label>
  </div>

  <div class="row">
    <button onclick="P('/move_human',{dx:+dx.value,dy:+dy.value})">human move</button>
    <button onclick="P('/move',{dx:+dx.value,dy:+dy.value})">raw move</button>
  </div>

  <div class="pad">
    <button onclick="P('/move',{dx:-30,dy:-30})">&#8598;</button>
    <button onclick="P('/move',{dx:0,dy:-30})">&uarr;</button>
    <button onclick="P('/move',{dx:30,dy:-30})">&#8599;</button>
    <button onclick="P('/move',{dx:-30,dy:0})">&larr;</button>
    <button onclick="P('/click',{button:'left'})">click</button>
    <button onclick="P('/move',{dx:30,dy:0})">&rarr;</button>
    <button onclick="P('/move',{dx:-30,dy:30})">&#8601;</button>
    <button onclick="P('/move',{dx:0,dy:30})">&darr;</button>
    <button onclick="P('/move',{dx:30,dy:30})">&#8600;</button>
  </div>

  <div class="row">
    <button onclick="P('/click',{button:'left'})">L click</button>
    <button onclick="P('/click',{button:'middle'})">M click</button>
    <button onclick="P('/click',{button:'right'})">R click</button>
  </div>

  <div class="row">
    <button onclick="P('/wheel',{delta:-3})">scroll &uarr;</button>
    <button onclick="P('/wheel',{delta:3})">scroll &darr;</button>
    <button id="aw" class="toggle" onclick="P('/autowalk/toggle')">autowalk</button>
  </div>

  <div class="row">
    <button onclick="P('/buttons/down',{mask:1})">hold L</button>
    <button onclick="P('/buttons/up',{mask:1})">release L</button>
    <button onclick="P('/buttons/release_all')">release all</button>
  </div>

  <pre id="log"></pre>

<script>
const BASE = (location.origin && location.origin !== "null")
              ? location.origin + "/api/v1"
              : "http://192.168.4.1/api/v1";
const log = document.getElementById('log');
const stateEl = document.getElementById('state');
const awBtn = document.getElementById('aw');

function logLine(s) {
  const t = new Date().toLocaleTimeString();
  log.textContent = `[${t}] ${s}\n` + log.textContent.split('\n').slice(0,40).join('\n');
}

async function P(path, body) {
  try {
    const r = await fetch(BASE + path, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: body ? JSON.stringify(body) : ''
    });
    const j = await r.json().catch(() => ({}));
    logLine(path + ' -> ' + JSON.stringify(j));
    return j;
  } catch(e) { logLine(path + ' FAIL ' + e.message); }
}

async function refresh() {
  try {
    const r = await fetch(BASE + '/status');
    const j = await r.json();
    stateEl.textContent = `buttons=${j.buttons} usb=${j.usb_ready?'ok':'-'} autowalk=${j.autowalk}`;
    awBtn.classList.toggle('on', !!j.autowalk);
  } catch(e) { stateEl.textContent = 'offline'; }
}
setInterval(refresh, 1500);
refresh();
</script>
</body>
</html>
